name: CI Pipeline

# Controls when the workflow will run
on:
  # Remove the push trigger
  # push:
  #   branches: [ main ] # Run on pushes to the main branch
  pull_request:

    branches: [ master, develop ] # Run on pull requests targeting the main branch

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    strategy:
      matrix:
        node-version: [20.x] # Specify the Node.js version(s) to use

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0 # Specify pnpm version if needed

      # 3. Set up Node.js environment
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm' # Enable caching for pnpm dependencies

      # 4. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile # Use --frozen-lockfile for CI

      # 5. Build the project (if necessary, uncomment if you have a build step)
      # - name: Build project
      #   run: pnpm build

      # 6. Run unit tests and collect coverage
      # Assumes 'pnpm test --coverage' runs unit tests via jest.config.js
      # and generates coverage in './coverage'
      # - name: Run unit tests
      #   run: pnpm run test --coverage

      # 7. Run E2E tests and collect coverage
      # Assumes 'pnpm test:e2e:coverage' runs e2e tests via tests/jest-e2e.config.js
      # and generates coverage in './coverage/e2e'
      - name: Run E2E tests
        run: pnpm run test:e2e:coverage # Make sure this script exists in your package.json

      # 8. (Optional) Upload coverage reports to Codecov
      # - name: Upload coverage reports to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }} # Required secret for private repos or Codecov Pro/Enterprise
      #     # Specify directories if coverage reports are not in standard locations
      #     # directory: ./coverage,./coverage/e2e
      #     # flags: unit,e2e # Optional flags to distinguish reports in Codecov UI
      #     fail_ci_if_error: true # Optional: fail workflow if upload fails